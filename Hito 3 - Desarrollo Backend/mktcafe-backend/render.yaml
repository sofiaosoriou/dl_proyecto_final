services:
  - type: web
    name: mktcafe-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mktcafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # lo ingresas manualmente en el dashboard de Render

databases:
  - name: mktcafe-db
    plan: free
    databaseName: mktcafe
